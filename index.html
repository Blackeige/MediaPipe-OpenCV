<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Hand Tracking VR</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#vr {
    display: flex;
    width: 100vw;
    height: 100vh;
}

.eye {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
}

video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: none;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#start {
    position: fixed;
    z-index: 10;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 22px;
    font-size: 18px;
    border: 0;
    border-radius: 12px;
}

#fullscreen {
    position: fixed;
    z-index: 10;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    font-size: 16px;
    border: 0;
    border-radius: 12px;
}
</style>
</head>

<body>

<button id="start">Démarrer</button>
<button id="fullscreen">Plein écran</button>

<div id="vr">

    <div class="eye">
        <video id="videoLeft" autoplay playsinline muted></video>
        <canvas id="canvasLeft"></canvas>
    </div>

    <div class="eye">
        <video id="videoRight" autoplay playsinline muted></video>
        <canvas id="canvasRight"></canvas>
    </div>

</div>

<script type="module">

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";

const startButton = document.getElementById("start");
const fullscreenButton = document.getElementById("fullscreen");

const videoLeft = document.getElementById("videoLeft");
const videoRight = document.getElementById("videoRight");

const canvasLeft = document.getElementById("canvasLeft");
const canvasRight = document.getElementById("canvasRight");

const ctxLeft = canvasLeft.getContext("2d");
const ctxRight = canvasRight.getContext("2d");

let detector;
let running = false;
let lastVideoTime = -1;

startButton.onclick = async () => {

    startButton.style.display = "none";

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" },

                width: {
                    exact: 320
                },

                height: {
                    exact: 240
                },

                frameRate: {
                    exact: 30
                }
            },

            audio: false
        });

        videoLeft.srcObject = stream;
        videoRight.srcObject = stream;

        await videoLeft.play();
        await videoRight.play();

        canvasLeft.width = 320;
        canvasLeft.height = 240;

        canvasRight.width = 320;
        canvasRight.height = 240;

        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        detector = await HandLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate: "GPU"
                },

                runningMode: "VIDEO",

                numHands: 2,

                minHandDetectionConfidence: 0.5,

                minHandPresenceConfidence: 0.5,

                minTrackingConfidence: 0.5
            }
        );

        running = true;

        detectHands();

    } catch (error) {

        console.error(error);

        startButton.style.display = "block";

        alert(
            "Erreur caméra ou MediaPipe :\n\n" +
            error.message
        );
    }
};


function detectHands() {

    if (!running || !detector) {
        return;
    }

    if (
        videoLeft.readyState >= 2 &&
        videoLeft.currentTime !== lastVideoTime
    ) {

        lastVideoTime = videoLeft.currentTime;

        const results = detector.detectForVideo(
            videoLeft,
            performance.now()
        );

        drawHands(ctxLeft, results);

        drawHands(ctxRight, results);
    }

    requestAnimationFrame(detectHands);
}


function drawHands(ctx, results) {

    ctx.clearRect(
        0,
        0,
        canvasLeft.width,
        canvasLeft.height
    );

    if (!results.landmarks) {
        return;
    }

    for (const landmarks of results.landmarks) {

        // Connexions de la main
        const connections = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [5,9],[9,10],[10,11],[11,12],
            [9,13],[13,14],[14,15],[15,16],
            [13,17],[17,18],[18,19],[19,20],
            [0,17]
        ];

        ctx.lineWidth = 2;
        ctx.strokeStyle = "red";

        for (const [a, b] of connections) {

            ctx.beginPath();

            ctx.moveTo(
                landmarks[a].x * 320,
                landmarks[a].y * 240
            );

            ctx.lineTo(
                landmarks[b].x * 320,
                landmarks[b].y * 240
            );

            ctx.stroke();
        }

        // 21 points
        for (const point of landmarks) {

            ctx.beginPath();

            ctx.arc(
                point.x * 320,
                point.y * 240,
                3,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "lime";
            ctx.fill();
        }
    }
}


fullscreenButton.onclick = async () => {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

        if (screen.orientation?.lock) {

            try {
                await screen.orientation.lock("landscape");
            } catch (e) {}
        }

    } catch (error) {

        console.error(error);

    }
};

</script>

</body>
</html>
