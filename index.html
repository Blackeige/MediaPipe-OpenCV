<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MediaPipe Hands</title>

<style>
html,body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial;
    overflow:hidden;
}

#video {
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#canvas {
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#status {
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:10;
    padding:12px;
    background:rgba(0,0,0,.75);
    border-radius:12px;
    text-align:center;
}

#button {
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:18px 25px;
    border:0;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status">Prêt</div>

<button id="button">
📷 Démarrer
</button>


<script type="module">

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const button =
document.getElementById("button");


function message(text) {
    status.textContent = text;
    console.log(text);
}


function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/*
================================
BOUTON
================================
*/

button.onclick = async () => {

    button.disabled = true;

    try {

        /*
        1. CAMÉRA
        */

        message("📷 Demande caméra...");

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                video:true,
                audio:false
            });


        video.srcObject = stream;

        await video.play();

        message("✅ Caméra OK");


        /*
        2. IMPORT MEDIAPIPE
        */

        message("⏳ Chargement MediaPipe...");

        const module =
            await import(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
            );


        const HandLandmarker =
            module.HandLandmarker;

        const FilesetResolver =
            module.FilesetResolver;


        if (!HandLandmarker ||
            !FilesetResolver) {

            throw new Error(
                "MediaPipe n'a pas chargé correctement"
            );
        }


        message("✅ MediaPipe chargé");


        /*
        3. WASM
        */

        message("⏳ Chargement moteur WASM...");


        const vision =
            await FilesetResolver
            .forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
            );


        message("✅ WASM chargé");


        /*
        4. MODÈLE
        */

        message("⏳ Chargement modèle mains...");


        const detector =
            await HandLandmarker
            .createFromOptions(
                vision,
                {

                    baseOptions: {

                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                        delegate:"GPU"
                    },

                    runningMode:"VIDEO",

                    numHands:2,

                    minHandDetectionConfidence:
                    0.5,

                    minHandPresenceConfidence:
                    0.5,

                    minTrackingConfidence:
                    0.5
                }
            );


        message("✅ MODÈLE CHARGÉ !");


        /*
        5. TRACKING
        */

        button.style.display =
            "none";


        let lastTime = -1;


        function loop() {

            if (
                video.readyState >= 2 &&
                video.currentTime !== lastTime
            ) {

                lastTime =
                    video.currentTime;


                const result =
                    detector.detectForVideo(
                        video,
                        performance.now()
                    );


                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                if (
                    result.landmarks &&
                    result.landmarks.length > 0
                ) {

                    message(
                        "🖐️ " +
                        result.landmarks.length +
                        " main(s) • " +
                        result.landmarks.length * 21 +
                        " points"
                    );


                    for (
                        const hand
                        of result.landmarks
                    ) {

                        drawHand(hand);
                    }

                } else {

                    message(
                        "🔎 Caméra OK • aucune main"
                    );
                }
            }


            requestAnimationFrame(loop);
        }


        loop();

    }

    catch(error) {

        console.error(error);

        message(
            "❌ " +
            error.name +
            " : " +
            error.message
        );

        button.disabled = false;
    }
};


/*
================================
DESSIN
================================
*/

const lines = [

    [0,1],[1,2],[2,3],[3,4],

    [0,5],[5,6],[6,7],[7,8],

    [0,9],[9,10],[10,11],[11,12],

    [0,13],[13,14],[14,15],[15,16],

    [0,17],[17,18],[18,19],[19,20],

    [5,9],[9,13],[13,17]
];


function drawHand(hand) {

    const points =
        hand.map(p => ({

            x:
                canvas.width -
                p.x * canvas.width,

            y:
                p.y * canvas.height
        }));


    /*
    LIGNES
    */

    ctx.beginPath();

    ctx.strokeStyle =
        "#00ff88";

    ctx.lineWidth = 4;


    for (
        const [a,b]
        of lines
    ) {

        ctx.moveTo(
            points[a].x,
            points[a].y
        );

        ctx.lineTo(
            points[b].x,
            points[b].y
        );
    }

    ctx.stroke();


    /*
    21 POINTS
    */

    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const p =
            points[i];


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            6,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "#ff1744";

        ctx.fill();


        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 12px Arial";

        ctx.fillText(
            i,
            p.x + 8,
            p.y - 8
        );
    }
}

</script>

</body>
</html>
