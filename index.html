<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Hand Tracking VR</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}

#vr {
    position: fixed;
    inset: 0;

    display: flex;

    width: 100%;
    height: 100%;

    background: #000;
}

.eye {
    position: relative;

    width: 50%;
    height: 100%;

    overflow: hidden;

    background: #000;
}

.eye video {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;
}

.eye canvas {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

.eye .landmarks {
    z-index: 10;
}

.eye .hand3d {
    z-index: 5;
}

#middle {
    position: fixed;

    left: 50%;
    top: 0;

    width: 2px;
    height: 100%;

    transform: translateX(-1px);

    background: rgba(255,255,255,.25);

    z-index: 20;

    pointer-events: none;
}

#status {
    position: fixed;

    top: 12px;
    left: 12px;
    right: 12px;

    z-index: 50;

    padding: 10px;

    border-radius: 12px;

    background: rgba(0,0,0,.75);

    color: white;

    text-align: center;

    font-size: 14px;

    pointer-events: none;
}

#start {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 100;

    padding: 18px 26px;

    border: none;

    border-radius: 16px;

    background: white;

    color: black;

    font-size: 18px;

    font-weight: bold;
}

#fullscreen {
    position: fixed;

    right: 15px;
    bottom: 15px;

    z-index: 100;

    width: 55px;
    height: 55px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,.75);

    color: white;

    font-size: 24px;

    display: none;
}

:fullscreen #status {
    top: 8px;
}

</style>
</head>


<body>

<div id="vr">

    <div class="eye">

        <video
            id="videoLeft"
            autoplay
            playsinline
            muted>
        </video>

        <canvas
            id="canvasLeft"
            class="landmarks">
        </canvas>

        <canvas
            id="hand3dLeft"
            class="hand3d">
        </canvas>

    </div>


    <div class="eye">

        <video
            id="videoRight"
            autoplay
            playsinline
            muted>
        </video>

        <canvas
            id="canvasRight"
            class="landmarks">
        </canvas>

        <canvas
            id="hand3dRight"
            class="hand3d">
        </canvas>

    </div>

</div>


<div id="middle"></div>


<div id="status">
    Prêt
</div>


<button id="start">
    📷 Démarrer VR
</button>


<button id="fullscreen">
    ⛶
</button>


<script type="module">


/* =========================================
   THREE.JS
========================================= */

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
    GLTFLoader
} from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================
   ÉLÉMENTS
========================================= */

const videoLeft =
    document.getElementById("videoLeft");

const videoRight =
    document.getElementById("videoRight");

const canvasLeft =
    document.getElementById("canvasLeft");

const canvasRight =
    document.getElementById("canvasRight");

const canvas3DLeft =
    document.getElementById("hand3dLeft");

const canvas3DRight =
    document.getElementById("hand3dRight");

const ctxLeft =
    canvasLeft.getContext("2d");

const ctxRight =
    canvasRight.getContext("2d");

const status =
    document.getElementById("status");

const start =
    document.getElementById("start");

const fullscreen =
    document.getElementById("fullscreen");


let detector = null;

let lastVideoTime = -1;


/* =========================================
   CONNEXIONS MAIN
========================================= */

const connections = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =========================================
   SMOOTHING
========================================= */

const SMOOTHING = 0.35;

let targetHands = [];


/* =========================================
   THREE.JS
========================================= */

const scenes = [];

const cameras3D = [];

const renderers = [];


/* =========================================
   CRÉATION SCÈNE 3D
========================================= */

function create3DScene(canvas) {

    const scene =
        new THREE.Scene();


    const camera =
        new THREE.OrthographicCamera(
            -1,
            1,
            1,
            -1,
            0.01,
            100
        );


    camera.position.z = 10;


    const renderer =
        new THREE.WebGLRenderer({

            canvas: canvas,

            alpha: true,

            antialias: false,

            powerPreference:
                "high-performance"
        });


    renderer.setPixelRatio(1);

    renderer.setClearColor(
        0x000000,
        0
    );


    scenes.push(scene);

    cameras3D.push(camera);

    renderers.push(renderer);


    return {
        scene,
        camera,
        renderer
    };
}


const left3D =
    create3DScene(
        canvas3DLeft
    );


const right3D =
    create3DScene(
        canvas3DRight
    );


/* =========================================
   MODÈLE GLB
========================================= */

const MODEL_URL =
    "https://raw.githubusercontent.com/Blackeige/MediaPipe-OpenCV/main/Do_Hand_DetailedRiggedAnimated_shared_16022026.glb";


let originalModel = null;


async function loadHandModel() {

    status.textContent =
        "⏳ Chargement modèle 3D...";


    const loader =
        new GLTFLoader();


    const gltf =
        await loader.loadAsync(
            MODEL_URL
        );


    originalModel =
        gltf.scene;


    originalModel.traverse(
        object => {

            if (
                object.isMesh
            ) {

                object.frustumCulled =
                    false;
            }
        }
    );
}


/* =========================================
   CRÉATION MAIN
========================================= */

function createHandInstance(scene) {

    const group =
        new THREE.Group();


    scene.add(group);


    const joints = [];


    const geometry =
        new THREE.SphereGeometry(
            0.035,
            6,
            6
        );


    const material =
        new THREE.MeshBasicMaterial({

            color: 0xff1744,

            transparent: true,

            opacity: 0
        });


    for (
        let i = 0;
        i < 21;
        i++
    ) {

        const joint =
            new THREE.Mesh(
                geometry,
                material
            );


        group.add(joint);

        joints.push(joint);
    }


    let model = null;


    if (originalModel) {

        model =
            originalModel.clone(true);


        model.visible =
            false;


        group.add(model);
    }


    return {

        group,

        model,

        joints,

        smooth: []
    };
}


const leftHands = [

    createHandInstance(
        left3D.scene
    ),

    createHandInstance(
        left3D.scene
    )

];


const rightHands = [

    createHandInstance(
        right3D.scene
    ),

    createHandInstance(
        right3D.scene
    )

];


/* =========================================
   LANDMARK → 3D
========================================= */

function landmarkTo3D(point) {

    return new THREE.Vector3(

        (point.x - 0.5) * 2,

        -(point.y - 0.5) * 2,

        -point.z * 0.25

    );
}


/* =========================================
   UPDATE MAIN
========================================= */

function updateHand3D(
    hand,
    landmarks
) {

    if (
        !landmarks ||
        landmarks.length < 21
    ) {

        hand.group.visible =
            false;

        return;
    }


    hand.group.visible =
        true;


    const target = [];


    for (
        let i = 0;
        i < 21;
        i++
    ) {

        target.push(
            landmarkTo3D(
                landmarks[i]
            )
        );
    }


    if (
        hand.smooth.length !== 21
    ) {

        hand.smooth =
            target.map(
                point =>
                    point.clone()
            );
    }


    for (
        let i = 0;
        i < 21;
        i++
    ) {

        hand.smooth[i].lerp(
            target[i],
            SMOOTHING
        );


        hand.joints[i].position.copy(
            hand.smooth[i]
        );
    }


    /*
        Si le GLB est chargé,
        on le positionne sur le poignet.
    */

    if (hand.model) {

        hand.model.visible =
            true;


        hand.model.position.copy(
            hand.smooth[0]
        );


        /*
            Taille automatique.
        */

        const wrist =
            hand.smooth[0];

        const middle =
            hand.smooth[9];


        const distance =
            wrist.distanceTo(
                middle
            );


        const scale =
            Math.max(
                0.01,
                distance * 2.2
            );


        hand.model.scale.setScalar(
            scale
        );
    }
}


/* =========================================
   RENDU 3D
========================================= */

function render3D() {

    for (
        let eye = 0;
        eye < 2;
        eye++
    ) {

        const hands =
            eye === 0
                ? leftHands
                : rightHands;


        const renderer =
            renderers[eye];


        const camera =
            cameras3D[eye];


        const canvas =
            renderer.domElement;


        const width =
            canvas.clientWidth;


        const height =
            canvas.clientHeight;


        if (
            width <= 0 ||
            height <= 0
        ) {

            continue;
        }


        renderer.setSize(
            width,
            height,
            false
        );


        const aspect =
            width / height;


        camera.left =
            -aspect;

        camera.right =
            aspect;

        camera.top =
            1;

        camera.bottom =
            -1;


        camera.updateProjectionMatrix();


        for (
            let i = 0;
            i < hands.length;
            i++
        ) {

            updateHand3D(
                hands[i],
                targetHands[i]
            );
        }


        renderer.render(
            scenes[eye],
            camera
        );
    }


    requestAnimationFrame(
        render3D
    );
}


/* =========================================
   CANVAS
========================================= */

function resizeCanvas() {

    canvasLeft.width =
        canvasLeft.clientWidth;

    canvasLeft.height =
        canvasLeft.clientHeight;


    canvasRight.width =
        canvasRight.clientWidth;

    canvasRight.height =
        canvasRight.clientHeight;


    for (
        const renderer
        of renderers
    ) {

        renderer.setSize(
            renderer.domElement.clientWidth,
            renderer.domElement.clientHeight,
            false
        );
    }
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================
   CAMÉRA ARRIÈRE
========================================= */

async function startCamera() {

    status.textContent =
        "📷 Demande caméra arrière...";


    /*
        IMPORTANT :

        contraintes SOUPLES.
        Pas de exact 320×240,
        car certains téléphones
        refusent cette combinaison.
    */

    const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video: {

                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 320
                },

                height: {
                    ideal: 240
                },

                frameRate: {
                    ideal: 30,
                    max: 30
                }
            },

            audio: false
        });


    videoLeft.srcObject =
        stream;

    videoRight.srcObject =
        stream;


    await videoLeft.play();

    await videoRight.play();


    status.textContent =
        "✅ Caméra arrière active";


    resizeCanvas();
}


/* =========================================
   MEDIAPIPE
========================================= */

async function startMediaPipe() {

    status.textContent =
        "⏳ Chargement MediaPipe...";


    const {
        HandLandmarker,
        FilesetResolver
    } = await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
    );


    status.textContent =
        "⏳ Chargement moteur...";


    const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"

        );


    status.textContent =
        "⏳ Chargement modèle mains...";


    detector =
        await HandLandmarker
        .createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate: "GPU"
                },


                runningMode: "VIDEO",


                numHands: 2,


                minHandDetectionConfidence:
                    0.5,

                minHandPresenceConfidence:
                    0.5,

                minTrackingConfidence:
                    0.5
            }
        );


    status.textContent =
        "✅ VR + MediaPipe prêts";
}


/* =========================================
   DESSIN DES MAINS
========================================= */

function drawHands(
    ctx,
    canvas,
    hands
) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for (
        const landmarks
        of hands
    ) {

        const points = [];


        /*
            Caméra arrière :
            pas de miroir.
        */

        for (
            const point
            of landmarks
        ) {

            const x =
                point.x *
                canvas.width;


            const y =
                point.y *
                canvas.height;


            points.push({
                x,
                y
            });
        }


        /*
            SQUELETTE
        */

        ctx.beginPath();

        ctx.strokeStyle =
            "#00ff88";

        ctx.lineWidth = 3;


        for (
            const [a,b]
            of connections
        ) {

            ctx.moveTo(
                points[a].x,
                points[a].y
            );

            ctx.lineTo(
                points[b].x,
                points[b].y
            );
        }


        ctx.stroke();


        /*
            POINTS
        */

        for (
            let i = 0;
            i < points.length;
            i++
        ) {

            const p =
                points[i];


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                5,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#ff1744";

            ctx.fill();


            ctx.strokeStyle =
                "#fff";

            ctx.lineWidth = 2;

            ctx.stroke();
        }
    }
}


/* =========================================
   TRACKING
========================================= */

function trackingLoop() {

    if (
        !detector ||
        videoLeft.readyState < 2
    ) {

        requestAnimationFrame(
            trackingLoop
        );

        return;
    }


    if (
        videoLeft.currentTime !==
        lastVideoTime
    ) {

        lastVideoTime =
            videoLeft.currentTime;


        /*
            UNE SEULE détection.
        */

        const result =
            detector.detectForVideo(

                videoLeft,

                performance.now()

            );


        const hands =
            result.landmarks || [];


        /*
            Même résultat pour :

            - œil gauche
            - œil droit
            - modèle 3D
        */

        targetHands =
            hands;


        drawHands(
            ctxLeft,
            canvasLeft,
            hands
        );


        drawHands(
            ctxRight,
            canvasRight,
            hands
        );


        if (hands.length > 0) {

            status.textContent =
                "🖐️ " +
                hands.length +
                " main" +
                (hands.length > 1 ? "s" : "") +
                " • " +
                (hands.length * 21) +
                " points • 3D";

        } else {

            status.textContent =
                "🥽 VR active • aucune main";
        }
    }


    requestAnimationFrame(
        trackingLoop
    );
}


/* =========================================
   PLEIN ÉCRAN
========================================= */

fullscreen.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();


                if (
                    screen.orientation &&
                    screen.orientation.lock
                ) {

                    try {

                        await screen.orientation
                            .lock("landscape");

                    } catch(e) {

                        console.log(
                            "Orientation non verrouillable"
                        );
                    }
                }

            } else {

                await document.exitFullscreen();
            }

        } catch(error) {

            console.error(error);
        }
    }
);


/* =========================================
   DÉMARRAGE
========================================= */

start.addEventListener(
    "click",
    async () => {

        start.disabled =
            true;


        try {

            /*
                1. CAMÉRA

                Elle démarre AVANT
                le GLB et MediaPipe.
            */

            await startCamera();


            /*
                2. MEDIAPIPE
            */

            await startMediaPipe();


            /*
                3. GLB

                Si le GLB échoue,
                la caméra et MediaPipe
                restent fonctionnels.
            */

            try {

                await loadHandModel();

            } catch(error) {

                console.error(
                    "Erreur GLB :",
                    error
                );

                status.textContent =
                    "⚠️ Caméra + MediaPipe actifs";
            }


            /*
                4. INTERFACE
            */

            fullscreen.style.display =
                "block";

            start.style.display =
                "none";


            /*
                5. RENDU 3D
            */

            render3D();


            /*
                6. TRACKING
            */

            trackingLoop();

        }

        catch(error) {

            console.error(error);


            status.textContent =
                "❌ " +
                error.name +
                " : " +
                error.message;


            start.disabled =
                false;
        }
    }
);

</script>

</body>
</html>
