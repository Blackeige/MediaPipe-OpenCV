<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>MediaPipe Hand Tracking</title>

<!-- MediaPipe officiel -->
<script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
    type="module"
    crossorigin="anonymous">
</script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#status {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 10;

    padding: 12px;

    border-radius: 12px;

    background: rgba(0,0,0,.75);
    color: white;

    text-align: center;
    font-size: 15px;
}

#start {
    position: fixed;
    z-index: 20;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 18px 25px;

    border: none;
    border-radius: 15px;

    background: white;
    color: black;

    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<canvas id="canvas"></canvas>

<div id="status">
    Prêt
</div>

<button id="start">
    📷 Démarrer
</button>


<script type="module">

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");

const start =
    document.getElementById("start");


/*
========================================
TAILLE CANVAS
========================================
*/

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/*
========================================
CONNEXIONS DES 21 LANDMARKS
========================================
*/

const connections = [

    // Pouce
    [0,1],
    [1,2],
    [2,3],
    [3,4],

    // Index
    [0,5],
    [5,6],
    [6,7],
    [7,8],

    // Majeur
    [0,9],
    [9,10],
    [10,11],
    [11,12],

    // Annulaire
    [0,13],
    [13,14],
    [14,15],
    [15,16],

    // Auriculaire
    [0,17],
    [17,18],
    [18,19],
    [19,20],

    // Paume
    [5,9],
    [9,13],
    [13,17]
];


/*
========================================
CAMÉRA
========================================
*/

async function startCamera() {

    status.textContent =
        "📷 Demande caméra...";


    const stream =
        await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });


    video.srcObject =
        stream;


    await video.play();


    status.textContent =
        "✅ Caméra OK";
}


/*
========================================
MEDIA PIPE
========================================
*/

async function startMediaPipe() {

    status.textContent =
        "⏳ Chargement de MediaPipe...";


    /*
        Les classes sont exposées
        par vision_bundle.mjs
    */

    const {
        HandLandmarker,
        FilesetResolver
    } = await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
    );


    status.textContent =
        "⏳ Chargement du moteur...";


    const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
        );


    status.textContent =
        "⏳ Chargement du modèle mains...";


    const handLandmarker =
        await HandLandmarker.createFromOptions(
            vision,
            {

                baseOptions: {

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate: "GPU"
                },

                runningMode: "VIDEO",

                numHands: 2,

                minHandDetectionConfidence: 0.5,

                minHandPresenceConfidence: 0.5,

                minTrackingConfidence: 0.5
            }
        );


    status.textContent =
        "✅ MediaPipe prêt";


    startTracking(handLandmarker);
}


/*
========================================
TRACKING
========================================
*/

let lastVideoTime = -1;


function startTracking(detector) {

    function loop() {

        if (
            video.readyState >= 2 &&
            video.currentTime !== lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;


            const result =
                detector.detectForVideo(
                    video,
                    performance.now()
                );


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            if (
                result.landmarks &&
                result.landmarks.length > 0
            ) {

                const count =
                    result.landmarks.length;


                status.textContent =
                    "🖐️ " +
                    count +
                    " main" +
                    (count > 1 ? "s" : "") +
                    " • " +
                    (count * 21) +
                    " points";


                for (
                    const hand
                    of result.landmarks
                ) {

                    drawHand(hand);
                }

            } else {

                status.textContent =
                    "🔎 Caméra OK • aucune main";
            }
        }


        requestAnimationFrame(loop);
    }


    loop();
}


/*
========================================
DESSIN DES MAINS
========================================
*/

function drawHand(landmarks) {

    const points =
        landmarks.map(point => {

            return {

                x:
                    canvas.width -
                    point.x *
                    canvas.width,

                y:
                    point.y *
                    canvas.height
            };
        });


    /*
        SQUELETTE
    */

    ctx.beginPath();

    ctx.lineWidth = 4;

    ctx.strokeStyle =
        "#00ff88";


    for (
        const [a,b]
        of connections
    ) {

        ctx.moveTo(
            points[a].x,
            points[a].y
        );

        ctx.lineTo(
            points[b].x,
            points[b].y
        );
    }


    ctx.stroke();


    /*
        21 POINTS
    */

    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const p =
            points[i];


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            6,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "#ff1744";

        ctx.fill();


        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 2;

        ctx.stroke();


        /*
            Numéro
        */

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 12px Arial";


        ctx.fillText(
            i,
            p.x + 8,
            p.y - 8
        );
    }
}


/*
========================================
BOUTON
========================================
*/

start.addEventListener(
    "click",
    async () => {

        start.disabled =
            true;


        try {

            /*
                IMPORTANT :
                la caméra est lancée
                exactement comme dans
                ton test qui fonctionnait.
            */

            await startCamera();


            /*
                Puis MediaPipe.
            */

            await startMediaPipe();


            start.style.display =
                "none";

        }

        catch (error) {

            console.error(error);


            status.textContent =
                "❌ " +
                error.name +
                " : " +
                error.message;


            start.disabled =
                false;
        }
    }
);

</script>

</body>
</html>
