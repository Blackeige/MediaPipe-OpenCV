<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test caméra</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
}

video {
    width: 100%;
    height: 70%;
    object-fit: cover;
    background: #111;
}

button {
    margin-top: 20px;
    padding: 18px 25px;
    font-size: 18px;
}
</style>
</head>

<body>

<h2 id="status">Test caméra</h2>

<video id="video" autoplay playsinline muted></video>

<br>

<button id="start">📷 Ouvrir la caméra</button>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");
const button = document.getElementById("start");

button.onclick = async () => {

    status.textContent = "Demande de caméra...";

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        video.srcObject = stream;

        status.textContent = "✅ CAMÉRA OK";

    } catch (error) {

        status.textContent =
            "❌ " + error.name + " : " + error.message;

        console.error(error);
    }
};

</script>

</body>
</html>
